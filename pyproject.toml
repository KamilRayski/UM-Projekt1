[project]
name = "pneumoniamnist-analysis"
version = "0.1.0"
description = "Pneumonia detection from chest X-rays using classical ML and PyTorch"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "joblib>=1.4.0",
    "kagglehub>=1.0.0",
    "matplotlib>=3.9.0",
    "nbclient>=0.10.0",
    "nbformat>=5.10.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pillow>=10.0.0",
    "python-docx>=1.1.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "seaborn>=0.13.0",
    "streamlit>=1.40.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
]

[tool.uv]
package = false

